[package]
name = "makepad-example-depth-cloud"
version = "0.1.0"
edition = "2021"
description = "Video -> realtime depthmap -> 3D point cloud viewer"
license = "MIT OR Apache-2.0"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]
# Native depth models (Depth-Anything-V2 / Video-Depth-Anything / DA3), CUDA.
localai = ["makepad-depth-cloud/localai"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false }
makepad-xr = { path = "../../xr", version = "1.0.0" }
makepad-depth-cloud = { path = "../../libs/depth_cloud" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(gpusim)"] }
